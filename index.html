<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE SIGN · 收款明细分配表</title>
<style>

    --bg:#0e1116; --panel:#161b22; --panel2:#1b222c; --line:#2a323d;
    --ink:#e6edf3; --mut:#8b97a6; --acc:#ffb000; --acc2:#3fb950; --red:#ff6b6b;
    --blue:#388bfd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5}
  .num{font-family:"SFMono-Regular",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#11161d,#0e1116);position:sticky;top:0;z-index:10}
  h1{margin:0;font-size:20px;letter-spacing:.5px;font-weight:700}
  h1 .b{color:var(--acc)}
  .sub{color:var(--mut);font-size:12.5px;margin-top:4px}
  .wrap{padding:22px 28px;max-width:1120px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  select,button,input[type=file]::file-selector-button{
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font-size:13.5px;cursor:pointer}
  select{min-width:150px}
  .btn-go{background:var(--acc);color:#1a1200;font-weight:700;border:none;padding:11px 22px;font-size:14px}
  .btn-go:hover{filter:brightness(1.07)}
  .btn-ghost{background:transparent}
  .btn-ghost:hover{border-color:var(--acc)}
  input[type=file]{color:var(--mut);font-size:12px;max-width:230px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:120px}
  .stat .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:20px;font-weight:700;margin-top:3px}
  .stat .v.g{color:var(--acc2)} .stat .v.y{color:var(--acc)}
  .group-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;
    border-left:3px solid var(--acc);padding-left:12px}
  .group-title.q{border-color:var(--blue)} .group-title.s{border-color:var(--acc)}
  .group-title.special{border-color:var(--red)} .group-title.review{border-color:var(--mut)}
  .group-title h2{margin:0;font-size:16px}
  .group-title .cnt{color:var(--mut);font-size:12.5px}
  .role-band{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;
    margin:30px 0 4px;font-weight:700}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.5px}
  td.r,th.r{text-align:right}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#1a212b}
  .total-row td{font-weight:700;background:#10151c;border-top:2px solid var(--line)}
  .total-row .amt{color:var(--acc)}
  .ref{color:var(--mut);font-size:12px}
  .fee{color:var(--mut)}
  .empty{color:var(--mut);padding:14px;text-align:center;font-style:italic}
  .flag{color:var(--red);font-size:11px;margin-left:6px}
  details{margin-bottom:10px}
  summary{cursor:pointer;color:var(--mut);font-size:12.5px;padding:6px 0}
  .note{color:var(--mut);font-size:12px;margin:14px 0;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;line-height:1.7}
  .note b{color:var(--ink)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .src{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px}
  .personbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .pbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:20px;padding:7px 15px;font-size:13px;cursor:pointer}
  .pbtn:hover{border-color:var(--acc)}
  .pbtn.active{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
  .pbtn.q.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pbtn .role{font-size:10px;color:var(--mut);margin-right:5px;text-transform:uppercase}
  .pbtn.active .role{color:inherit;opacity:.7}
  .pbar-label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;
    align-self:center;margin-right:4px}
  .tag{font-size:10px;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700}
  .tag.dep{background:#3a2a00;color:var(--acc)} .tag.bal{background:#0a2e1a;color:var(--acc2)}
  .held .group-title{border-color:var(--acc)}
  #gate{position:fixed;inset:0;background:#0b0e13;z-index:100;display:flex;align-items:center;justify-content:center}
  .gate-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 34px;width:340px;text-align:center}
  .gate-title{font-size:20px;font-weight:700}
  .gate-title{color:var(--acc)}
  .gate-sub{color:var(--mut);font-size:13px;margin:6px 0 18px}
  #gatePw{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font-size:14px;margin-bottom:12px}
  #gateBtn{width:100%;background:var(--acc);color:#1a1200;border:none;border-radius:8px;
    padding:11px;font-size:14px;font-weight:700;cursor:pointer}
  .gate-err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
  .gate-note{color:var(--mut);font-size:11px;margin-top:16px;line-height:1.6}
</style>
</head>

const SALES   = {ba:"Barry", ck:"Chike", je:"Jenny", ja:"Jack", rex:"Rex", ha:"Harry", f:"Fiona"};
const QUOTERS = {kh:"Khin", sy:"Sysy", sa:"Sandy", ca:"Carine", es:"Estella"};
const SALES_ORDER   = ["Barry","Chike","Jenny","Jack","Rex","Harry","Fiona"];
const QUOTER_ORDER  = ["Khin","Sysy","Sandy","Carine","Estella"];
const GST = 1.1;
const FY_START = "2025-07-01", FY_END = "2026-06-30";   // 财年 2025-26
const BACKEND_URL = "data.json";   // GitHub Pages 上由 Action 定时生成;留空则「更新」按钮回退为 CSV 导入
function inFY(fpd){ return fpd && fpd>=FY_START && fpd<=FY_END; }

let DATA = SNAPSHOT.map(r=>({inv:r[0], ref:r[1], total:r[2], fpd:r[3], customer:"", status:""}));

function isDeposit(ref){ return /deposit|订金|定金|押金|预付|\bdep\b/i.test(ref||""); }
function isBalance(ref){ return /balance|尾款|余款|结清|\bbal\b/i.test(ref||""); }

function parseRef(refRaw, inv){
  const res = {sales:null, quoters:[], fee:0, status:"ok", note:""};
  if(refRaw==null || String(refRaw).trim()===""){ res.status="review"; res.note="Reference 为空"; return res; }
  let ref = String(refRaw).trim();
  const low0 = ref.toLowerCase();
  ref = ref.replace(/[\(（][^\)）]*[\)）]/g," ");
  // 去掉"工单号/PO号/NO."及其后面的数字,避免被误当安装费(如 WORK ORDER NO. 17711)
  ref = ref.replace(/\b(?:work\s*order|w\.?o\.?|p\.?o\.?|order|no)\b\.?\s*#?:?\s*\d+/gi, " ");
  const toks = ref.split(/[-\s;,，]+/).map(t=>t.trim()).filter(Boolean);
  const low  = toks.map(t=>t.toLowerCase());
  if(low.length && SALES[low[0]]) res.sales = SALES[low[0]];
  else { for(const t of low){ if(SALES[t]){ res.sales=SALES[t]; break; } } }
  for(const t of low){ if(QUOTERS[t] && !res.quoters.includes(QUOTERS[t])) res.quoters.push(QUOTERS[t]); }
  const invDigits = (inv||"").replace(/\D/g,"");
  let fee=null;
  for(const t of low){
    if(t==="o"){ if(fee===null) fee=0; continue; }
    if(/^\d+(\.\d+)?$/.test(t)){
      if(t===invDigits) continue;
      if(t.length>=6) continue;
      const n=parseFloat(t);
      if(n>=40000) continue;
      if(fee===null) fee=n;
    }
  }
  res.fee = fee===null?0:fee;
  if(!res.sales && res.quoters.length===0){
    if(/^p\d{5,}/i.test(low0) || low0.includes("amend")) { res.status="skip"; res.note="PO/Amend(非提成)"; }
    else { res.status="review"; res.note="未识别销售/报价员"; }
  }
  return res;
}

function amountOf(total, fee){ return Math.round((total/GST - fee)*100)/100; }
function money(n){ return n.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monthOf(fpd){ return fpd ? fpd.slice(0,7) : "无日期"; }
function isFullPaid(st){ const s=(st||"").toLowerCase(); return s.includes("full paid")||s.includes("付清"); }
function isCredit(st){ const s=(st||"").toLowerCase(); return s.includes("credit")||s.includes("贷项")||s.includes("退"); }

function buildMonths(){
  // 只显示财年(2025/7/1–2026/6/30):财年总览 + 财年内各月
  const FY_MONTHS = ["2025-07","2025-08","2025-09","2025-10","2025-11","2025-12",
                     "2026-01","2026-02","2026-03","2026-04","2026-05","2026-06"];
  const sel = document.getElementById("month"); sel.innerHTML = "";
  const ofy=document.createElement("option"); ofy.value="fy2025-26"; ofy.textContent="★ 财年总览 2025-26 (7/1–6/30)"; sel.appendChild(ofy);
  // 只列出数据里出现过、且落在财年内的月份
  const present = new Set(DATA.map(d=>monthOf(d.fpd)));
  DATA.forEach(d=>{ if(d.issue) present.add(monthOf(d.issue)); });
  FY_MONTHS.filter(m=>present.has(m)).reverse().forEach(m=>{
    const o=document.createElement("option"); o.value=m; o.textContent=m; sel.appendChild(o); });
  sel.value = "fy2025-26";   // 默认财年总览
}

let LAST_RESULT = null;
function compute(){
  const mSel = document.getElementById("month").value;
  const hasStatus = DATA.some(d=>d.status && d.status.trim()!=="");

  const settle = {};
  DATA.forEach(d=>{
    if(!d.customer) return;
    if(isDeposit(d.ref)||isBalance(d.ref)){
      const k=d.customer.trim().toLowerCase();
      (settle[k]=settle[k]||{members:[],allPaid:true}).members.push(d);
    }
  });
  Object.values(settle).forEach(g=>{ g.allPaid = g.members.every(m=>isFullPaid(m.status)); });
  function settlementHeld(d){
    if(!d.customer) return false;
    if(!(isDeposit(d.ref)||isBalance(d.ref))) return false;
    const g=settle[d.customer.trim().toLowerCase()];
    return g ? !g.allPaid : false;
  }

  const salesMap={}, quoterMap={}, noQuoter=[], review=[], skip=[], held=[];
  let okCount=0;

  DATA.forEach(d=>{
    const paid = hasStatus ? isFullPaid(d.status) : true;
    const p = parseRef(d.ref, d.inv);
    const amt = amountOf(d.total, p.fee);
    const rec = {inv:d.inv, ref:d.ref, total:d.total, fee:p.fee, amt, sales:p.sales,
                 quoters:p.quoters, neg:amt<0, customer:d.customer, fpd:d.fpd,
                 dep:isDeposit(d.ref), bal:isBalance(d.ref), status:d.status};
    if(paid && settlementHeld(d)){ held.push(rec); return; }
    if(!paid) return;
    if(p.status==="skip"){ skip.push({...rec,note:p.note}); return; }
    if(p.status==="review"){ review.push({...rec,note:p.note}); return; }
    if(mSel==="fy2025-26"){ if(!inFY(d.fpd)) return; }
    else if(mSel!=="all" && monthOf(d.fpd)!==mSel) return;
    okCount++;
    if(p.sales){
      if(p.quoters.length===0){ noQuoter.push(rec); }
      else { (salesMap[p.sales]=salesMap[p.sales]||[]).push(rec); }
    }
    p.quoters.forEach(q=>{ (quoterMap[q]=quoterMap[q]||[]).push(rec); });
  });

  LAST_RESULT = {mSel, hasStatus, salesMap, quoterMap, noQuoter, review, skip, held, okCount};

  // ===== 已开单统计(排除 Credit;数据加载时 Credit 已剔除)=====
  // 不受 Full Paid 过滤影响;按开单日期 Issue Date 做期间筛选(无 issue 日期则只计入"全部")
  const bSales={}, bQuoter={}, bNoQuoter=[], bAll=[]; let bAllInv=0,bAllTot=0,bAllFee=0,bAllAmt=0;
  DATA.forEach(d=>{
    if(mSel==="fy2025-26"){ if(!(d.issue && d.issue>=FY_START && d.issue<=FY_END)) return; }
    else if(mSel!=="all" && mSel!=="无日期"){ if(!(d.issue && monthOf(d.issue)===mSel)) return; }
    const p=parseRef(d.ref,d.inv);
    if(p.status==="skip") return;                 // PO/Amend 不算
    const amt=amountOf(d.total,p.fee);
    const rec={inv:d.inv,ref:d.ref,total:d.total,fee:p.fee,amt,sales:p.sales,quoters:p.quoters,
               neg:amt<0,fpd:d.fpd,issue:d.issue,dep:isDeposit(d.ref),bal:isBalance(d.ref),status:d.status};
    bAllInv++; bAllTot+=d.total; bAllFee+=p.fee; bAllAmt+=amt; bAll.push(rec);
    if(p.sales){
      if(p.quoters.length===0) bNoQuoter.push(rec);
      else (bSales[p.sales]=bSales[p.sales]||[]).push(rec);
    }
    p.quoters.forEach(q=>{ (bQuoter[q]=bQuoter[q]||[]).push(rec); });
  });
  bAll.sort((a,b)=>String(b.issue||"").localeCompare(String(a.issue||"")));
  LAST_RESULT.billed = {bSales, bQuoter, bNoQuoter, bAll, bAllInv, bAllTot, bAllFee, bAllAmt};

  // ===== 定金/尾款已支付清单(Reference 含 deposit 或 balance + 状态 Full Paid)=====
  const depPaid=[];
  DATA.forEach(d=>{
    if(!((isDeposit(d.ref)||isBalance(d.ref)) && isFullPaid(d.status))) return;
    if(mSel==="fy2025-26"){ if(!inFY(d.fpd)) return; }
    else if(mSel!=="all" && mSel!=="无日期"){ if(monthOf(d.fpd)!==mSel) return; }
    const p=parseRef(d.ref,d.inv);
    depPaid.push({inv:d.inv, ref:d.ref, total:d.total, fee:p.fee, amt:amountOf(d.total,p.fee),
                  fpd:d.fpd, issue:d.issue, customer:d.customer, sales:p.sales||"—",
                  quoters:p.quoters, neg:amountOf(d.total,p.fee)<0,
                  kind:isDeposit(d.ref)?"订金":"尾款", dep:isDeposit(d.ref), bal:isBalance(d.ref), status:d.status});
  });
  depPaid.sort((a,b)=>String(b.fpd||"").localeCompare(String(a.fpd||"")));
  LAST_RESULT.depPaid = depPaid;

  buildPersonBar();
  render();
}

function buildPersonBar(){
  const R=LAST_RESULT; const bar=document.getElementById("personbar"); bar.innerHTML="";
  const lbl=document.createElement("span"); lbl.className="pbar-label"; lbl.textContent="只看："; bar.appendChild(lbl);
  const allBtn=document.createElement("button"); allBtn.className="pbtn"+(selectedPerson==="all"?" active":"");
  allBtn.textContent="全部"; allBtn.onclick=()=>{ selectedPerson="all"; render(); buildPersonBar(); }; bar.appendChild(allBtn);
  SALES_ORDER.forEach(n=>{ if(!R.salesMap[n]) return;
    const b=document.createElement("button");

    b.className="pbtn s"+(on?" active":""); b.innerHTML='<span class="role">销</span>'+n;
    b.onclick=()=>{ selectedPerson={role:"sales",name:n}; render(); buildPersonBar(); }; bar.appendChild(b);
  });
  QUOTER_ORDER.forEach(n=>{ if(!R.quoterMap[n]) return;
    const b=document.createElement("button");
    const on = selectedPerson!=="all"&&selectedPerson.role==="quoter"&&selectedPerson.name===n;
    b.className="pbtn q"+(on?" active":""); b.innerHTML='<span class="role">报</span>'+n;
    b.onclick=()=>{ selectedPerson={role:"quoter",name:n}; render(); buildPersonBar(); }; bar.appendChild(b);
  });
}

function tagFor(r){ return (r.dep?'<span class="tag dep">订金</span>':'')+(r.bal?'<span class="tag bal">尾款</span>':''); }
function fmtDate(d){ return d ? d : '<span class="ref">—</span>'; }
function tableFor(list){
  if(!list.length) return '<div class="empty">无记录</div>';
  let sum=0, totalSum=0, feeSum=0, body="";
  list.forEach(r=>{ sum+=r.amt; totalSum+=r.total; feeSum+=r.fee;
    body+=`<tr><td>${r.inv}${tagFor(r)}</td><td class="ref">${escapeHtml(r.ref)}</td>`+
      `<td class="num">${fmtDate(r.fpd)}</td>`+
      `<td class="r num">${money(r.total)}</td><td class="r num fee">${money(r.fee)}</td>`+
      `<td class="r num">${money(r.amt)}${r.neg?'<span class="flag">负</span>':''}</td></tr>`; });
  return `<table><thead><tr><th>单号</th><th>Reference</th><th>付款日期</th><th class="r">Total(含GST)</th><th class="r">安装费</th><th class="r">金额</th></tr></thead>`+
    `<tbody>${body}<tr class="total-row"><td colspan="3">合计 (${list.length} 单)</td>`+
    `<td class="r num">${money(totalSum)}</td><td class="r num">${money(feeSum)}</td>`+
    `<td class="r num amt">${money(sum)}</td></tr></tbody></table>`;
}
// 已开单明细:显示开单日期 Issue Date(而非付款日期)
function tableForBilled(list){
  if(!list.length) return '<div class="empty">无记录</div>';
  let sum=0, totalSum=0, feeSum=0, body="";
  list.forEach(r=>{ sum+=r.amt; totalSum+=r.total; feeSum+=r.fee;
    body+=`<tr><td>${r.inv}${tagFor(r)}</td><td class="ref">${escapeHtml(r.ref)}</td>`+
      `<td class="num">${fmtDate(r.issue)}</td>`+
      `<td class="r num">${money(r.total)}</td><td class="r num fee">${money(r.fee)}</td>`+
      `<td class="r num">${money(r.amt)}${r.neg?'<span class="flag">负</span>':''}</td></tr>`; });
  return `<table><thead><tr><th>单号</th><th>Reference</th><th>开单日期</th><th class="r">Total(含GST)</th><th class="r">安装费</th><th class="r">金额</th></tr></thead>`+
    `<tbody>${body}<tr class="total-row"><td colspan="3">合计 (${list.length} 单)</td>`+
    `<td class="r num">${money(totalSum)}</td><td class="r num">${money(feeSum)}</td>`+
    `<td class="r num amt">${money(sum)}</td></tr></tbody></table>`;
}
// 定金/尾款已支付清单 — 含类型/销售/客户/开单日期/付款日期
// who=null 表示全公司;否则 {role:"sales"|"quoter", name} 只显示该人名下的单
function depositPaidTable(who){
  let list = (LAST_RESULT && LAST_RESULT.depPaid) || [];
  let title = "全公司 · Reference 含 deposit/balance 且 Full Paid";
  if(who){
    if(who.role==="sales") list = list.filter(r=>r.sales===who.name);
    else list = list.filter(r=>(r.quoters||[]).includes(who.name));
    title = who.name + " 名下 · 定金/尾款(Full Paid)";
  }
  let html = `<div class="group-title special"><h2>定金/尾款已支付清单</h2><span class="cnt">${list.length} 单 · ${title}</span></div>`;
  if(!list.length) return html + '<div class="empty">无记录(需含客户名与 Payment Status 的完整数据)</div>';
  let totalSum=0, feeSum=0, amtSum=0, body="";
  list.forEach(r=>{ totalSum+=r.total; feeSum+=r.fee; amtSum+=r.amt;
    body+=`<tr><td>${r.inv}</td><td>${r.kind}</td><td>${escapeHtml(r.customer||"")}</td><td><b>${r.sales}</b></td>`+
      `<td class="ref">${escapeHtml(r.ref)}</td>`+
      `<td class="num">${fmtDate(r.issue)}</td><td class="num">${fmtDate(r.fpd)}</td>`+
      `<td class="r num">${money(r.total)}</td><td class="r num fee">${money(r.fee)}</td>`+
      `<td class="r num">${money(r.amt)}${r.neg?'<span class="flag">负</span>':''}</td></tr>`; });
  html+=`<table><thead><tr><th>单号</th><th>类型</th><th>客户</th><th>销售</th><th>Reference</th><th>开单日期</th><th>付款日期</th>`+
    `<th class="r">Total(含GST)</th><th class="r">安装费</th><th class="r">金额</th></tr></thead><tbody>${body}`+
    `<tr class="total-row"><td colspan="7">合计 (${list.length} 单)</td>`+
    `<td class="r num">${money(totalSum)}</td><td class="r num">${money(feeSum)}</td>`+
    `<td class="r num amt">${money(amtSum)}</td></tr></tbody></table>`;
  return html;
}
function groupBlock(name, list, cls, roleTag){
  const sum=list.reduce((a,r)=>a+r.amt,0);
  const tot=list.reduce((a,r)=>a+r.total,0);
  const fee=list.reduce((a,r)=>a+r.fee,0);
  return `<div class="group-title ${cls}"><h2>${name}</h2><span class="cnt">${list.length} 单 · 金额 $${money(sum)} · 安装费 $${money(fee)} · 总收款 $${money(tot)}</span><span class="src">${roleTag}</span></div>`+tableFor(list);
}

function render(){
  const R=LAST_RESULT; if(!R) return;
  const out=document.getElementById("out"); out.innerHTML="";
  if(viewMode==="billed"){ renderBilled(); return; }
  const allSalesSum=Object.values(R.salesMap).flat().reduce((a,r)=>a+r.amt,0);
  const allQuoterSum=Object.values(R.quoterMap).flat().reduce((a,r)=>a+r.amt,0);
  // 总收款/安装费按"发票"去重统计(一张单可能同时在多个报价员名下,避免重复加总)
  const seen={}; let totalRecv=0, feeRecv=0;
  [...Object.values(R.salesMap).flat(), ...Object.values(R.quoterMap).flat(), ...(R.noQuoter||[])].forEach(r=>{
    if(seen[r.inv]) return; seen[r.inv]=1; totalRecv+=r.total; feeRecv+=r.fee; });
  document.getElementById("stats").innerHTML=
    `<div class="stat"><div class="k">已计入(单数)</div><div class="v g">${Object.keys(seen).length}</div></div>`+
    `<div class="stat"><div class="k">总收款(含GST+安装)</div><div class="v y">$${money(totalRecv)}</div></div>`+
    `<div class="stat"><div class="k">安装费合计</div><div class="v y">$${money(feeRecv)}</div></div>`+
    `<div class="stat"><div class="k">销售金额合计</div><div class="v y">$${money(allSalesSum)}</div></div>`+
    `<div class="stat"><div class="k">报价金额合计</div><div class="v y">$${money(allQuoterSum)}</div></div>`+
    `<div class="stat"><div class="k">待结清</div><div class="v" style="color:var(--acc)">${R.held.length}</div></div>`;

  let html="";
  if(selectedPerson!=="all"){
    const role=selectedPerson.role, name=selectedPerson.name;
    if(role==="sales"){
      html+=`<div class="role-band">— 销售员 · ${name} —</div>`;
      html+=groupBlock(name, R.salesMap[name]||[], "s", "销售");
      const own=(R.noQuoter||[]).filter(r=>r.sales===name);
      html+=`<div class="role-band">— ${name} 的「只有销售、无报价员」单 —</div>`;
      html+=`<div class="group-title special"><h2>${name} · 无报价员</h2><span class="cnt">${own.length} 单</span></div>`+tableFor(own);
    }else{
      html+=`<div class="role-band">— 报价员 · ${name} —</div>`;
      html+=groupBlock(name, R.quoterMap[name]||[], "q", "报价");
    }
    html+=depositPaidTable(selectedPerson);
    out.innerHTML=html; return;
  }

  // 财年总览汇总表(仅 FY + 全部视图)
  if(R.mSel==="fy2025-26"){
    const rows=[];
    const agg=l=>[l.length, l.reduce((a,r)=>a+r.amt,0), l.reduce((a,r)=>a+r.fee,0), l.reduce((a,r)=>a+r.total,0)];
    SALES_ORDER.forEach(n=>{ if(R.salesMap[n]){ const a=agg(R.salesMap[n]); rows.push(["销售",n,...a]); }});
    QUOTER_ORDER.forEach(n=>{ if(R.quoterMap[n]){ const a=agg(R.quoterMap[n]); rows.push(["报价",n,...a]); }});
    const nq=R.noQuoter||[];
    if(nq.length){ const a=agg(nq); rows.push(["仅销售(无报价)","—",...a]); }
    const body=rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="r num">${r[2]}</td><td class="r num amt">$${money(r[3])}</td><td class="r num">$${money(r[4])}</td><td class="r num">$${money(r[5])}</td></tr>`).join("");
    html+=`<div class="role-band">— 财年总览 2025-26 (2025/7/1 – 2026/6/30) —</div>`;
    html+=`<table><thead><tr><th>角色</th><th>人员</th><th class="r">单数</th><th class="r">金额(提成基数)</th><th class="r">安装费合计</th><th class="r">总收款(含GST)</th></tr></thead><tbody>${body}</tbody></table>`;
    html+=`<div class="note" style="margin:10px 0 20px">下方为各人员财年明细。内置快照仅含 2026 年 2–5 月;完整财年请「导入」monday 全量 CSV。</div>`;
  }

  html+=`<div class="role-band">— 销售员 —</div>`;
  SALES_ORDER.forEach(n=>{ if(R.salesMap[n]) html+=groupBlock(n,R.salesMap[n],"s","销售"); });
  html+=`<div class="role-band">— 报价员(可多个) —</div>`;
  QUOTER_ORDER.forEach(n=>{ if(R.quoterMap[n]) html+=groupBlock(n,R.quoterMap[n],"q","报价"); });
  html+=`<div class="role-band">— 特殊:只有销售员、没有报价员 —</div>`;
  html+=`<div class="group-title special"><h2>只写销售 · 无报价员</h2><span class="cnt">${R.noQuoter.length} 单</span></div>`+tableFor(R.noQuoter);
  if(R.held.length){
    html+=`<div class="role-band">— 待结清(订金已付,尾款未付清 → 暂不发提成)—</div>`;
    html+=`<div class="held">`+tableForReview(R.held)+`</div>`;
  }
  html+=`<details><summary>需人工核对 (${R.review.length}) ＋ 已跳过 PO/Amend (${R.skip.length})</summary>`;
  html+=`<div class="group-title review"><h2>需人工核对</h2><span class="cnt">未识别销售/报价员</span></div>`+tableForReview(R.review);
  html+=`<div class="group-title review"><h2>已跳过(非提成)</h2><span class="cnt">PO / Amend</span></div>`+tableForReview(R.skip);
  html+=`</details>`;
  html+=depositPaidTable();
  out.innerHTML=html;
}

  const agg=l=>[l.length, l.reduce((a,r)=>a+r.total,0), l.reduce((a,r)=>a+r.fee,0), l.reduce((a,r)=>a+r.amt,0)];
  const rows=[];

  const body=rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="r num">${r[2]}</td><td class="r num">$${money(r[3])}</td><td class="r num">$${money(r[4])}</td><td class="r num amt">$${money(r[5])}</td></tr>`).join("");

  let html=`<div class="role-band">— 已开单统计(排除 Credit)· ${periodLabel} —</div>`;
  html+=`<div class="note" style="margin:0 0 14px">已开单 = Payment Status 不是 Credit 的所有单(Invoiced / Full Paid / Over Due / Deposit Received 都算),与提成表(只算 Full Paid)互相独立。金额 = Total ÷ 1.1 − 安装费。</div>`;
  html+=`<table><thead><tr><th>角色</th><th>人员</th><th class="r">单数</th><th class="r">Total(含GST)</th><th class="r">安装费</th><th class="r">金额</th></tr></thead><tbody>${body}`+
    `<tr class="total-row"><td colspan="2">全公司合计</td><td class="r num">${B.bAllInv}</td><td class="r num">$${money(B.bAllTot)}</td><td class="r num">$${money(B.bAllFee)}</td><td class="r num amt">$${money(B.bAllAmt)}</td></tr></tbody></table>`;

  // 明细(含开单日期列)
  if(selectedPerson!=="all"){
    const role=selectedPerson.role, name=selectedPerson.name;
    const list = role==="sales" ? (B.bSales[name]||[]) : (B.bQuoter[name]||[]);
    html+=`<div class="role-band">— ${name} 已开单明细 —</div>`+tableForBilled(list);
    if(role==="sales"){ const own=B.bNoQuoter.filter(r=>r.sales===name);
      if(own.length){ html+=`<div class="role-band">— ${name} 无报价员单 —</div>`+tableForBilled(own); } }
  } else {
    html+=`<div class="role-band">— 已开单逐单明细(按开单日期)—</div>`+tableForBilled(B.bAll);
  }
  out.innerHTML=html;
}
function tableForReview(list){
  if(!list.length) return '<div class="empty">无</div>';
  let body="";
  list.forEach(r=>{ body+=`<tr><td>${r.inv}${tagFor(r)}</td><td class="ref">${escapeHtml(r.ref)}</td><td class="num">${fmtDate(r.fpd)}</td><td class="r num">${money(r.total)}</td><td class="ref">${r.note||r.customer||""}</td></tr>`; });
  return `<table><thead><tr><th>单号</th><th>Reference</th><th>付款日期</th><th class="r">Total</th><th>说明/客户</th></tr></thead><tbody>${body}</tbody></table>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function parseCSV(text){
  const rows=[]; let i=0, field="", row=[], inQ=false;
  while(i<text.length){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;} field+=c;i++;continue; }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++; }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>x&&x.trim()!==""));
}
function findCol(h,keys){ const l=h.map(x=>x.toLowerCase().trim()); for(const k of keys){ const i=l.findIndex(x=>x.includes(k)); if(i>=0) return i; } return -1; }
function stripCustomer(name, invVal){ let s=String(name||"").trim();
  s=s.replace(/^INV-?\s*\d+\s*[-–:]?\s*/i,"");
  if(invVal) s=s.replace(invVal,"").replace(/^\s*[-–:]\s*/,"");
  return s.trim();
}
document.getElementById("csv").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const rows=parseCSV(rd.result); if(rows.length<2){ alert("CSV 没有数据行"); return; }
    const head=rows[0];
    const iInv=findCol(head,["invoice","单号"]);
    const iName=findCol(head,["name","名称","项目","item"]);
    const iRef=findCol(head,["reference","参考","备注"]);
    const iTot=findCol(head,["total (aud)","total","总额","金额"]);
    const iFpd=findCol(head,["full paid","付清","fullpaid"]);
    const iIss=findCol(head,["issue date","issue","开单","开票"]);
    const iSt =findCol(head,["payment status","付款状态","状态","status"]);
    if(iRef<0||iTot<0){ alert("未找到 Reference 或 Total 列。表头:\n"+head.join(" | ")); return; }
    const data=[]; let creditSkipped=0;
    for(let r=1;r<rows.length;r++){ const row=rows[r];
      const st = iSt>=0?(row[iSt]||""):"";
      if(isCredit(st)){ creditSkipped++; continue; }   // Credit 单不导入
      const invV = iInv>=0?(row[iInv]||"").trim():"";
      const nameV= iName>=0?(row[iName]||"").trim():"";
      const tot=parseFloat(String(row[iTot]||"").replace(/[^0-9.\-]/g,""))||0;
      data.push({ inv: invV || (nameV.match(/INV-?\d+/i)?(nameV.match(/INV-?\d+/i)[0]):("行"+r)),
                  ref: iRef>=0?row[iRef]:"", total:tot,
                  fpd: iFpd>=0?normDate(row[iFpd]):null,
                  issue: iIss>=0?normDate(row[iIss]):null,
                  status: st,
                  customer: stripCustomer(nameV, invV) }); }
    if(!data.length){ alert("没有可用数据行"); return; }
    DATA=data;
    const withStatus=data.filter(d=>d.status).length;
    document.getElementById("datasrc").textContent="已导入 CSV("+data.length+" 行"+(creditSkipped?"，已剔除 "+creditSkipped+" 张 Credit":"")+(withStatus?"，含状态":"")+")";
    selectedPerson="all"; buildMonths(); compute();
    alert("导入成功："+data.length+" 行。已重新计算。");
  }catch(err){ alert("解析 CSV 失败："+err.message); } };
  rd.readAsText(f);
});
function normDate(s){ s=(s||"").trim(); if(!s) return null;
  let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  return null;
}

document.getElementById("export").addEventListener("click", ()=>{
  if(!LAST_RESULT){ alert("请先点「计算」"); return; }
  const R=LAST_RESULT; const lines=[["角色","人员","单号","Reference","付款日期","Total","安装费","金额","订金/尾款"]];
  const tag=r=>(r.dep?"订金":"")+(r.bal?"尾款":"");
  const push=(role,name,list)=>list.forEach(r=>lines.push([role,name,r.inv,r.ref,r.fpd||"",r.total,r.fee,r.amt,tag(r)]));
  SALES_ORDER.forEach(n=>{ if(R.salesMap[n]) push("销售",n,R.salesMap[n]); });
  QUOTER_ORDER.forEach(n=>{ if(R.quoterMap[n]) push("报价",n,R.quoterMap[n]); });
  (R.noQuoter||[]).forEach(r=>lines.push(["仅销售(无报价)",r.sales||"",r.inv,r.ref,r.fpd||"",r.total,r.fee,r.amt,tag(r)]));
  const csv=lines.map(r=>r.map(x=>{ const s=String(x); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`commission_${R.mSel}.csv`; a.click();
});

  }
  const btn=document.getElementById("syncBtn"); const old=btn.textContent; btn.textContent="⟳ 更新中…"; btn.disabled=true;

    const res=await fetch(BACKEND_URL,{headers:{"Accept":"application/json"}});

    DATA=json.filter(d=>!isCredit(d.status)).map(d=>({inv:d.inv||"", ref:d.ref||"", total:Number(d.total)||0,
      fpd:d.fpd||null, issue:d.issue||null, status:d.status||"", customer:d.customer||""}));

  }catch(err){ alert("从 monday 更新失败:"+err.message+"\n\n可改用「导入 CSV」。"); }
  finally{ btn.textContent=old; btn.disabled=false; }
});
