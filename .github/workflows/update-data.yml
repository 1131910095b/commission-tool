name: Update commission data from monday

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch monday data
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          BOARD_ID: "5028690641"
        run: node fetch_monday.js

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh commission data"
            git push
          fi
